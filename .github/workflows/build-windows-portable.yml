name: Build Tesseract Portable (32-bit ZIP)

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      - name: 🛠️ SW (Software Network) installieren
        # Wir geben Tesseract den Paketmanager, den es in der Fehlermeldung verlangt
        run: |
          curl.exe -L "https://software-network.org/client/sw-master-windows-client.zip" -o sw.zip
          7z.exe x sw.zip -o"C:\sw"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\sw"

      - name: ⚙️ CMake konfigurieren (32-Bit)
        # SW lädt sich die 32-Bit-Abhängigkeiten (Leptonica etc.) jetzt völlig automatisch im Hintergrund herunter
        run: cmake -B build -S . -A Win32

      - name: 🏗️ Tesseract kompilieren
        run: cmake --build build --config Release

      - name: 🗂️ Dateien für AutoIt sammeln
        run: cmake --install build --config Release --prefix tesseract-portable-32

      - name: 🤐 Als ZIP-Archiv verpacken
        run: Compress-Archive -Path tesseract-portable-32\* -DestinationPath Tesseract-AutoIt-Ready-32bit.zip

      - name: 📤 ZIP als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Tesseract-Portable-ZIP-32bit
          path: Tesseract-AutoIt-Ready-32bit.zip
