name: Build Tesseract Portable (32-bit ZIP)

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      - name: 📦 Abhängigkeiten installieren (Leptonica)
        run: |
          vcpkg integrate install
          vcpkg install leptonica:x86-windows pkgconf:x86-windows
          
      - name: ⚙️ CMake konfigurieren (32-Bit & Abgespeckt)
        # NEU: -DBUILD_TRAINING_TOOLS=OFF hinzugefügt
        run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x86-windows -A Win32 -DSW_BUILD=OFF -DDISABLE_CURL=ON -DDISABLE_ARCHIVE=ON -DBUILD_TRAINING_TOOLS=OFF

      - name: 🏗️ Tesseract kompilieren
        run: cmake --build build --config Release

      - name: 🗂️ Dateien für AutoIt sammeln
        run: cmake --install build --config Release --prefix tesseract-portable-32

      - name: 🤐 Als ZIP-Archiv verpacken
        run: Compress-Archive -Path tesseract-portable-32\* -DestinationPath Tesseract-AutoIt-Ready-32bit.zip

      - name: 📤 ZIP als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Tesseract-Portable-ZIP-32bit
          path: Tesseract-AutoIt-Ready-32bit.zip
